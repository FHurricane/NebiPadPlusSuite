name: Build installers

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    name: macOS DMG
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          modules: 'qtcharts qtmultimedia qtwebengine qtpositioning qtwebchannel qtpdf'
          cache: true
      - name: Configure
        run: cmake -S . -B build-release -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$Qt6_DIR"
      - name: Build
        run: cmake --build build-release --config Release --parallel 3
      - name: Test
        run: ctest --test-dir build-release -C Release --output-on-failure
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Bundle Qt and create DMG
        run: |
          scripts/package_macos.sh build-release/NebiPadPlus.app
          mkdir -p dist
          hdiutil create -volname 'NebiPad+ Suite' -srcfolder build-release/NebiPadPlus.app -ov -format UDZO dist/NebiPadPlusSuite-macOS.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: NebiPadPlusSuite-macOS
          path: dist/NebiPadPlusSuite-macOS.dmg

  windows:
    name: Windows installer
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          modules: 'qtcharts qtmultimedia qtwebengine qtpositioning qtwebchannel qtpdf'
          cache: true
      - name: Install NSIS
        shell: pwsh
        run: choco install nsis -y --no-progress
      - name: Configure
        shell: pwsh
        run: cmake -S . -B build-release -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$env:Qt6_DIR"
      - name: Build
        shell: pwsh
        run: cmake --build build-release --config Release --parallel 3
      - name: Test
        shell: pwsh
        run: ctest --test-dir build-release -C Release --output-on-failure
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Create installer
        shell: pwsh
        run: scripts/package_windows.ps1 build-release dist
      - uses: actions/upload-artifact@v4
        with:
          name: NebiPadPlusSuite-Windows
          path: dist/NebiPadPlusSuite-Windows-x64.exe

  linux:
    name: Linux packages
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          modules: 'qtcharts qtmultimedia qtwebengine qtpositioning qtwebchannel qtpdf'
          cache: true
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libgl1-mesa-dev libfuse2
      - name: Configure
        run: cmake -S . -B build-release -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_PREFIX_PATH="$Qt6_DIR"
      - name: Build
        run: cmake --build build-release --parallel 3
      - name: Test
        run: ctest --test-dir build-release --output-on-failure
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Create AppImage and DEB
        run: scripts/package_linux.sh build-release dist
      - uses: actions/upload-artifact@v4
        with:
          name: NebiPadPlusSuite-Linux
          path: |
            dist/*.AppImage
            dist/*.deb

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
